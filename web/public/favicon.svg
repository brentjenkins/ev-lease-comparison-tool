           L6,24
           Q6,16 14,15
           L40,15
           Q46,15 49,20
           L55,27
           Q58,29 58,34
           L58,43
           Q58,48 53,48
           Z
           M16,18 Q19,16 23,16 L39,16 L44,23 L14,23 Z"
        fill="#6b7280" fill-rule="evenodd"/>

  <!-- lightning bolt on the door -->
  <path d="M7,2 L7,13 L10,13 L10,22 L17,10 L13,10 L17,2 Z"
        fill="#ffcc00" transform="translate(24,24) scale(0.75)"/>

