    <path d="M0,-5 C-2.5,-5 -3.6,-3.7 -3.6,-2.3 C-3.6,-1 -2.2,-0.4 0,0 C2.3,0.4 3.6,1 3.6,2.4 C3.6,3.8 2.5,5 0,5"
          stroke="#ffffff" stroke-width="1.7" fill="none" stroke-linecap="round"/>
    <line x1="0" y1="-6.7" x2="0" y2="6.7" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round"/>
  </g>
</svg>
